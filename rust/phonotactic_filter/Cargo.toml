[package]
name = "phonotactic_filter"
version = "0.1.0"
edition = "2021"
authors = ["NYT Spelling Bee Solver Team"]
description = "High-performance phonotactic constraint validation for English letter sequences"

[lib]
name = "phonotactic_filter"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }

[profile.release]
opt-level = 3           # Maximum optimization
lto = true             # Link-time optimization for smaller, faster binaries
codegen-units = 1      # Better optimization at cost of compile time
strip = true           # Strip symbols from binary
panic = "abort"        # Smaller binary, no unwinding overhead
